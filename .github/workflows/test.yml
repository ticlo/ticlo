name: Test

on:
  push:
    branches:
      - master
      - ghaction
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: America/Los_Angeles

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run oxfmt-check
      - run: pnpm run build-i18n
      - run: pnpm run oxlint
      - run: pnpm exec tsgo --noEmit
      - run: pnpm run build-package
      - run: pnpm run vite-build

  test-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
      - run: mkdir -p coverage css
      - run: pnpm run build-icons
      - run: pnpm run build-less
      - run: pnpm run build-antd-style
      - name: Vitest Browser
        run: pnpm run test-browser-coverage
      - name: Coveralls Vitest Browser
        if: github.event_name != 'pull_request'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}
          path-to-lcov: ./coverage/browser/lcov.info
          parallel: true
          flag-name: browser

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p coverage css
      - name: Vitest
        run: pnpm run test-coverage
      - name: Coveralls Vitest
        if: github.event_name != 'pull_request'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}
          path-to-lcov: ./coverage/node/lcov.info
          parallel: true
          flag-name: strict
      - name: Test Ticlo
        run: pnpm run ticlo-test-c8
      - name: Coveralls Ticlo
        if: github.event_name != 'pull_request'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}
          path-to-lcov: ./coverage/nyc-ticlo.lcov
          parallel: true
          flag-name: ticlo

  finish-coverage:
    needs: [test, test-browser]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}
          parallel-finished: true
