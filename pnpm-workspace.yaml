packages:
  - 'packages/*'
  - 'app'
allowBuilds:
  esbuild: true
# These upstream peer ranges lag behind versions covered by our integration tests and lint checks.
peerDependencyRules:
  allowedVersions:
    '@hono/node-ws@1.3.1>@hono/node-server': '2.1.1'
    'eslint-plugin-react@7.37.5>eslint': '10.10.0'
    'ticlo-big-calendar@2.1.3>react': '19.2.8'
    'ticlo-big-calendar@2.1.3>react-dom': '19.2.8'
minimumReleaseAgeExclude:
  - '@types/node@26.5.0'
  - '@typescript-eslint/eslint-plugin@8.70.0'
  - '@typescript-eslint/parser@8.70.0'
  - '@typescript-eslint/project-service@8.70.0'
  - '@typescript-eslint/scope-manager@8.70.0'
  - '@typescript-eslint/tsconfig-utils@8.70.0'
  - '@typescript-eslint/type-utils@8.70.0'
  - '@typescript-eslint/types@8.70.0'
  - '@typescript-eslint/typescript-estree@8.70.0'
  - '@typescript-eslint/utils@8.70.0'
  - '@typescript-eslint/visitor-keys@8.70.0'
  - antd@6.6.3
  - marked@18.0.12
